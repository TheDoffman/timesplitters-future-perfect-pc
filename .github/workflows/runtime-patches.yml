name: Runtime patch transitions

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  plan:
    name: Scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      transitions: ${{ steps.scope.outputs.transitions }}
      native: ${{ steps.scope.outputs.native }}
      gpu: ${{ steps.scope.outputs.gpu }}
      issue_forms: ${{ steps.scope.outputs.issue_forms }}
      issue_resolution: ${{ steps.scope.outputs.issue_resolution }}
      textures: ${{ steps.scope.outputs.textures }}
      release: ${{ steps.scope.outputs.release }}
      launcher: ${{ steps.launcher.outputs.run }}
      head: ${{ steps.launcher.outputs.head }}
      revision: ${{ steps.pins.outputs.revision }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Select affected test suites
        id: scope
        run: python tools/ci/ci-runtime-scope.py
      - name: Select launcher checks from the same revision
        id: launcher
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = workflow_dispatch ] || [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = 0000000000000000000000000000000000000000 ]; then
            python tools/ci/launcher-compatibility.py scope --head "$HEAD_SHA" --all
          else
            python tools/ci/launcher-compatibility.py scope --base "$BASE_SHA" --head "$HEAD_SHA"
          fi
      - name: Read shared runtime and test dependency pins
        id: pins
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import re
          import subprocess
          import sys
          revision = re.search(r"\$revision = '([0-9a-f]{40})'", Path('tsfp.ps1').read_text()).group(1)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'revision={revision}\n')
          dependencies = [line for line in Path('requirements.txt').read_text().splitlines()
                          if line.startswith(('pytest==', 'pytest-xdist==', 'execnet=='))]
          subprocess.run([sys.executable, '-m', 'pip', 'install', *dependencies], check=True)
          PY
      - name: Test CI suite selection and feature handoff index
        run: python -m pytest tests/repository/test_runtime_checks.py tests/support/test_runtime_shards.py tests/repository/test_ci_runtime_scope.py tests/repository/test_ci_pr_gate.py tests/repository/test_linux_foundation.py tests/repository/test_project_paths.py tests/launcher/test_launcher_compatibility.py tests/repository/test_mac_backlog.py tests/repository/test_repo_context.py -q --tb=short
      - name: Validate repository context and affected-system guide updates
        run: python tools/repo-context.py check --ci
      - name: Test subscription worker selection and publication boundaries
        run: python -m unittest discover -s tests/repository -p test_compatibility_worker.py -v
      - name: Test optional local-router context reader
        run: node --test tests/repository/repository-context.test.mjs tests/repository/repository-evidence.test.mjs

  patches:
    name: Patches · ${{ matrix.os == 'windows-latest' && 'Windows' || 'Mac' }} · ${{ matrix.shard }}/3
    needs: plan
    if: needs.plan.outputs.transitions == 'true'
    runs-on: ${{ matrix.os }}
    # Retain headroom for slow hosts while each shard covers its full collection.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
        shard: [1, 2, 3]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Restore suite timing history
        continue-on-error: true
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: build/test-performance
          key: suite-timing-v1-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: suite-timing-v1-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ matrix.shard }}-
      - name: Read shared runtime and test dependency pins
        id: pins
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import re
          import subprocess
          import sys
          revision = re.search(r"\$revision = '([0-9a-f]{40})'", Path('tsfp.ps1').read_text()).group(1)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'revision={revision}\n')
          dependencies = [line for line in Path('requirements.txt').read_text().splitlines()
                          if line.startswith(('pytest==', 'pytest-xdist==', 'execnet=='))]
          subprocess.run([sys.executable, '-m', 'pip', 'install', *dependencies], check=True)
          PY
      - name: Prepare bundled runtime without a network clone
        run: python tools/build/prepare-runtime.py
      - name: Test patch tracking, branch switches and historical upgrades
        run: python tools/ci/run-runtime-checks.py patches --shard ${{ matrix.shard }}/3 --profile-prefix ci

      - name: Upload test results
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-results-${{ github.job }}-${{ runner.os }}-${{ matrix.shard }}
          path: build/test-results
          if-no-files-found: ignore
          retention-days: 14

      - name: Save suite timing history
        if: always() && hashFiles('build/test-performance/**/state.json') != ''
        continue-on-error: true
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: build/test-performance
          key: suite-timing-v1-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Upload suite timing reports
        if: always() && hashFiles('build/test-performance/**/last-run.json') != ''
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: suite-timing-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}-${{ matrix.shard }}
          path: build/test-performance
          retention-days: 30

  native:
    name: Runtime · ${{ matrix.os == 'windows-latest' && 'Windows' || 'Mac' }} · ${{ matrix.shard }}/3
    needs: plan
    if: needs.plan.outputs.native == 'true'
    runs-on: ${{ matrix.os }}
    # Windows native fixtures exceeded30m while still making test progress.
    timeout-minutes: ${{ matrix.os == 'windows-latest' && 45 || 30 }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
        shard: [1, 2, 3]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Restore suite timing history
        continue-on-error: true
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: build/test-performance
          key: suite-timing-v1-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: suite-timing-v1-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ matrix.shard }}-
      - name: Read shared runtime and test dependency pins
        id: pins
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import re
          import subprocess
          import sys
          revision = re.search(r"\$revision = '([0-9a-f]{40})'", Path('tsfp.ps1').read_text()).group(1)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'revision={revision}\n')
          dependencies = [line for line in Path('requirements.txt').read_text().splitlines()
                          if line.startswith(('pytest==', 'pytest-xdist==', 'execnet=='))]
          subprocess.run([sys.executable, '-m', 'pip', 'install', *dependencies], check=True)
          PY
      - name: Prepare bundled runtime without a network clone
        if: needs.plan.outputs.native == 'true'
        run: python tools/build/prepare-runtime.py
      - name: Apply shared runtime patches
        if: needs.plan.outputs.native == 'true'
        run: python tools/build/apply-patches.py external/ts3FPrecomp patches
      - name: Install pinned runtime and texture test dependencies
        if: needs.plan.outputs.native == 'true'
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess, sys
          pins = [line for line in Path('requirements.txt').read_text().splitlines()
                  if line.startswith(('capstone==', 'Pillow==', 'numpy==', 'cmake==', 'ninja==', 'pefile=='))]
          subprocess.run([sys.executable, '-m', 'pip', 'install', *pins], check=True)
          PY
      - name: Install pinned Online certificate dependencies
        if: needs.plan.outputs.native == 'true'
        run: python -m pip install -r requirements-release.txt
      - name: Test native runtime, rendering and input regressions
        if: needs.plan.outputs.native == 'true'
        run: python tools/ci/run-runtime-checks.py native --shard ${{ matrix.shard }}/3 --profile-prefix ci
      - name: Upload test results
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-results-${{ github.job }}-${{ runner.os }}-${{ matrix.shard }}
          path: build/test-results
          if-no-files-found: ignore
          retention-days: 14

      - name: Save suite timing history
        if: always() && hashFiles('build/test-performance/**/state.json') != ''
        continue-on-error: true
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: build/test-performance
          key: suite-timing-v1-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Upload suite timing reports
        if: always() && hashFiles('build/test-performance/**/last-run.json') != ''
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: suite-timing-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}-${{ matrix.shard }}
          path: build/test-performance
          retention-days: 30

  mac-gpu:
    name: GPU · Mac
    needs: plan
    if: needs.plan.outputs.gpu == 'true'
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Prepare bundled runtime without a network clone
        run: python tools/build/prepare-runtime.py
      - name: Apply shared runtime patches
        run: python tools/build/apply-patches.py external/ts3FPrecomp patches
      - name: Install pinned GPU build dependencies
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess, sys
          pins = [line for line in Path('requirements.txt').read_text().splitlines()
                  if line.startswith(('cmake==', 'ninja=='))]
          subprocess.run([sys.executable, '-m', 'pip', 'install', *pins], check=True)
          PY
      - name: Validate common RHI on the native Mac GPU without game assets
        run: python tools/testing/test-rhi-mac.py --setup-sdk --driver moltenvk

  release:
    name: Release · ${{ matrix.os == 'windows-latest' && 'Windows' || 'Mac' }}
    needs: plan
    if: needs.plan.outputs.release == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Restore suite timing history
        continue-on-error: true
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: build/test-performance
          key: suite-timing-v1-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: suite-timing-v1-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-
      - name: Install pinned release test dependencies
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess, sys
          pins = [line for line in Path('requirements.txt').read_text().splitlines()
                  if line.startswith(('pytest==', 'pytest-xdist==', 'execnet=='))]
          subprocess.run([sys.executable, '-m', 'pip', 'install', *pins], check=True)
          PY
      - name: Test release validation and disposable fixture cleanup
        run: python tools/ci/run-runtime-checks.py release --profile-prefix ci
      - name: Upload test results
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-results-${{ github.job }}-${{ runner.os }}
          path: build/test-results
          if-no-files-found: ignore
          retention-days: 14

      - name: Save suite timing history
        if: always() && hashFiles('build/test-performance/**/state.json') != ''
        continue-on-error: true
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: build/test-performance
          key: suite-timing-v1-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Upload suite timing reports
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: suite-timing-release-${{ runner.os }}-${{ runner.arch }}
          path: build/test-performance
          if-no-files-found: ignore
          retention-days: 30

  linux-foundation:
    name: Vulkan · Linux
    needs: plan
    if: needs.plan.outputs.gpu == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CC: clang
      CXX: clang++
      SDL_VIDEODRIVER: x11
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install Linux host development dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang pkg-config libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxfixes-dev libxss-dev libxtst-dev libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev libdrm-dev libgbm-dev libegl1-mesa-dev libdecor-0-dev libasound2-dev libpulse-dev libudev-dev libvulkan1 mesa-vulkan-drivers vulkan-tools xvfb xauth weston libssl-dev libgtk-3-dev libavcodec-dev libavutil-dev patchelf python3-tk
          python -m venv .venv-linux
          .venv-linux/bin/python -m pip install -r requirements.txt
      - name: Check SDK isolation and real Linux host memory providers
        run: .venv-linux/bin/python -m pytest tests/repository/test_linux_foundation.py tests/launcher/test_native_linux_package.py tests/launcher/test_linux_dependency_sources.py tests/launcher/test_linux_elf_closure.py tests/repository/test_linux_media.py tests/gameplay/test_native_linux.py tests/gameplay/test_auto_look.py tests/gameplay/test_native_crash.py tests/compiler/test_linux_host.py tests/compiler/test_linux_map_query.py tests/graphics/test_vulkan_interface.py tests/graphics/test_upload_rows.py tests/compiler/test_host_pages.py tests/compiler/test_host_memory_stats.py tests/compiler/test_native_vm_host.py tests/compiler/test_shared_views.py -q --tb=short
      - name: Check Linux native UDP and real Online companion lifecycle
        run: xvfb-run -a .venv-linux/bin/python -m pytest tests/network/test_native_network.py tests/network/test_online_companion.py -q --tb=short
      - name: Run shared Vulkan and production replay contracts with software Vulkan
        run: |
          LVP_ICD=$(find /usr/share/vulkan/icd.d -name 'lvp_icd*.json' -print -quit)
          test -n "$LVP_ICD"
          xvfb-run -a .venv-linux/bin/python tools/testing/test-rhi-linux.py --prepare-runtime --setup-sdk --driver-manifest "$LVP_ICD"
          xvfb-run -a .venv-linux/bin/python tools/testing/test-rhi-linux.py --driver-manifest "$LVP_ICD" --compat12
      - name: Check shared gameplay, HUD, menus and audio on Linux
        run: |
          tests=(
            tests/gameplay/test_frame_clock.py tests/gameplay/test_native_timing.py
            tests/gameplay/test_native_vehicle_timing.py tests/gameplay/test_native_wind.py
            tests/gameplay/test_native_demo_timing.py tests/gameplay/test_auto_look.py
            tests/gameplay/test_mounted_mouse.py tests/gameplay/test_reload_keys.py
            tests/textures/test_texture_preference.py
            tests/graphics/test_kill_feed.py tests/graphics/test_fov_settings.py
            tests/graphics/test_visibility_queries.py
            tests/graphics/test_cutscene_letterbox.py tests/graphics/test_menu_text.py tests/graphics/test_zero_base_indices.py
            tests/graphics/test_quit_menu.py tests/graphics/test_channel_clears.py
            tests/media/test_audio_audit.py tests/media/test_audio_candidates.py tests/media/test_audio_loops.py tests/media/test_audio_measurements.py tests/media/test_audio_timing.py tests/media/test_audio_output_gain.py
            tests/media/test_audio_device_recovery.py tests/media/test_native_movie_file.py
            tests/compiler/test_linux_desktop.py tests/compiler/test_linux_video_startup.py tests/compiler/test_guest_storage.py
            tests/compiler/test_guest_paths.py tests/compiler/test_io_lifetime.py
          )
          .venv-linux/bin/python -m pytest "${tests[@]}" -q --tb=short
      - name: Retain Linux validation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linux-x64-vulkan-foundation
          path: |
            logs/rhi-linux.*
            logs/rhi-linux-compat12.*
            logs/replay-linux.log
            logs/replay-linux-compat12.log
          if-no-files-found: ignore
          retention-days: 14

  launcher:
    needs: plan
    if: needs.plan.outputs.launcher == 'true'
    uses: ./.github/workflows/launcher-build.yml
    with:
      source_ref: ${{ needs.plan.outputs.head }}

  issue_forms:
    needs: plan
    if: needs.plan.outputs.issue_forms == 'true'
    uses: ./.github/workflows/issue-forms.yml

  issue_resolution:
    needs: plan
    if: needs.plan.outputs.issue_resolution == 'true'
    uses: ./.github/workflows/issue-resolution.yml

  textures:
    needs: plan
    if: needs.plan.outputs.textures == 'true'
    uses: ./.github/workflows/texture-pack.yml

  # Always report one result; selected work must pass, unselected work must skip.
  pr-validation:
    name: PR validation
    permissions:
      contents: read
      actions: read
    needs: [plan, patches, native, mac-gpu, release, launcher, linux-foundation, issue_forms, issue_resolution, textures]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Require every selected runtime and launcher check
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          RUN_TRANSITIONS: ${{ needs.plan.outputs.transitions }}
          RUN_NATIVE: ${{ needs.plan.outputs.native }}
          RUN_RELEASE: ${{ needs.plan.outputs.release }}
          RUN_LAUNCHER: ${{ needs.plan.outputs.launcher }}
          PATCHES_RESULT: ${{ needs.patches.result }}
          NATIVE_RESULT: ${{ needs.native.result }}
          RELEASE_RESULT: ${{ needs.release.result }}
          RUN_MAC_GPU: ${{ needs.plan.outputs.gpu }}
          MAC_GPU_RESULT: ${{ needs.mac-gpu.result }}
          LAUNCHER_RESULT: ${{ needs.launcher.result }}
          RUN_LINUX: ${{ needs.plan.outputs.gpu }}
          LINUX_RESULT: ${{ needs.linux-foundation.result }}
          RUN_ISSUE_FORMS: ${{ needs.plan.outputs.issue_forms }}
          ISSUE_FORMS_RESULT: ${{ needs.issue_forms.result }}
          RUN_ISSUE_RESOLUTION: ${{ needs.plan.outputs.issue_resolution }}
          ISSUE_RESOLUTION_RESULT: ${{ needs.issue_resolution.result }}
          RUN_TEXTURES: ${{ needs.plan.outputs.textures }}
          TEXTURES_RESULT: ${{ needs.textures.result }}
        run: python tools/ci/ci-pr-gate.py
      - name: Summarize check results and durations
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/ci/pr-check-summary.py
