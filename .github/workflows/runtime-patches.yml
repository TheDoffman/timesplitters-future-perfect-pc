name: Runtime patch transitions

on:
  push:
    branches: [main]
    paths:
      - src/**
      - patches/**
      - tests/**
      - tools/**
      - config/**
      - requirements.txt
      - tsfp.ps1
      - AGENTS.md
      - docs/agent-context/**
      - MAC_PORT_BACKLOG.md
      - .github/workflows/runtime-patches.yml
      - .github/workflows/launcher*.yml
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  plan:
    name: Select runtime checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      transitions: ${{ steps.scope.outputs.transitions }}
      native: ${{ steps.scope.outputs.native }}
      gpu: ${{ steps.scope.outputs.gpu }}
      release: ${{ steps.scope.outputs.release }}
      revision: ${{ steps.pins.outputs.revision }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Select affected test suites
        id: scope
        run: python tools/ci-runtime-scope.py
      - name: Read shared runtime and test dependency pins
        id: pins
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import re
          import subprocess
          import sys
          revision = re.search(r"\$revision = '([0-9a-f]{40})'", Path('tsfp.ps1').read_text()).group(1)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'revision={revision}\n')
          dependency = next(line for line in Path('requirements.txt').read_text().splitlines()
                            if line.startswith('pytest=='))
          subprocess.run([sys.executable, '-m', 'pip', 'install', dependency], check=True)
          PY
      - name: Test CI suite selection and feature handoff index
        run: python -m pytest tests/test_ci_runtime_scope.py tests/test_mac_backlog.py tests/test_repo_context.py -q --tb=short
      - name: Validate repository context and affected-system guide updates
        run: python tools/repo-context.py check --ci
      - name: Test optional local-router context reader
        run: node --test tests/repository-context.test.mjs tests/repository-evidence.test.mjs

  patches:
    name: Patch upgrades (${{ matrix.os }})
    needs: plan
    if: needs.plan.outputs.transitions == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Read shared runtime and test dependency pins
        id: pins
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import re
          import subprocess
          import sys
          revision = re.search(r"\$revision = '([0-9a-f]{40})'", Path('tsfp.ps1').read_text()).group(1)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'revision={revision}\n')
          dependency = next(line for line in Path('requirements.txt').read_text().splitlines()
                            if line.startswith('pytest=='))
          subprocess.run([sys.executable, '-m', 'pip', 'install', dependency], check=True)
          PY
      - name: Check out pinned upstream source only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: nemonicicon/ts3FPrecomp
          ref: ${{ needs.plan.outputs.revision }}
          path: external/ts3FPrecomp
          persist-credentials: false
      - name: Test patch tracking, branch switches and historical upgrades
        run: python -m pytest tests/test_patch_tracking.py tests/test_patch_updates.py -q --tb=short

  native:
    name: Native runtime (${{ matrix.os }})
    needs: plan
    if: needs.plan.outputs.native == 'true' || needs.plan.outputs.release == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Read shared runtime and test dependency pins
        id: pins
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import re
          import subprocess
          import sys
          revision = re.search(r"\$revision = '([0-9a-f]{40})'", Path('tsfp.ps1').read_text()).group(1)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'revision={revision}\n')
          dependency = next(line for line in Path('requirements.txt').read_text().splitlines()
                            if line.startswith('pytest=='))
          subprocess.run([sys.executable, '-m', 'pip', 'install', dependency], check=True)
          PY
      - name: Check out pinned upstream source only
        if: needs.plan.outputs.native == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: nemonicicon/ts3FPrecomp
          ref: ${{ needs.plan.outputs.revision }}
          path: external/ts3FPrecomp
          persist-credentials: false
      - name: Apply shared runtime patches
        if: needs.plan.outputs.native == 'true'
        run: python tools/apply-patches.py external/ts3FPrecomp patches
      - name: Install pinned runtime and texture test dependencies
        if: needs.plan.outputs.native == 'true'
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess, sys
          pins = [line for line in Path('requirements.txt').read_text().splitlines()
                  if line.startswith(('capstone==', 'Pillow==', 'numpy==', 'cmake==', 'ninja=='))]
          subprocess.run([sys.executable, '-m', 'pip', 'install', *pins], check=True)
          PY
      - name: Test native runtime, rendering and input regressions
        if: needs.plan.outputs.native == 'true'
        run: |
          tests=(
            tests/test_texture_runtime.py tests/texture_pack_tools.py tests/test_texture_hybrid_plan.py
            tests/texture_archive_signatures.py tests/texture_embedded_scan.py
            tests/texture_nonpak.py tests/texture_variants.py
            tests/test_native_mac_tools.py tests/test_native_mac_launcher.py tests/test_testing_profile.py
            tests/test_native_compiler.py tests/test_audio_timing.py
            tests/test_frame_clock.py tests/test_native_frame_stats.py tests/test_native_timing.py tests/test_native_entity_trace.py tests/test_profile_accept.py
            tests/test_native_effect_trace.py tests/test_surface_shader_feedback.py tests/test_combiner_constants.py tests/test_surface_preservation.py
            tests/test_recomp_float_joins.py tests/test_recomp_vehicle_joins.py
            tests/test_recomp_generation.py tests/test_framebuffer_sampling.py tests/test_terminal_depth.py tests/test_ghost_rendering.py tests/test_ghost_targets.py
            tests/test_xmv_stop.py tests/test_native_movie_file.py tests/test_discord_presence.py tests/test_discord_macos.py tests/test_native_crash.py
            tests/test_crash_capture.py
            tests/test_cutscene_letterbox.py tests/test_pc_display_modes.py tests/test_decal_projection.py
            tests/test_channel_clears.py tests/test_objectives_health.py
            tests/test_fov_settings.py tests/test_storage_menu.py tests/test_text_read_scope.py
            tests/test_menu_sampling.py
            tests/test_renderer_host.py tests/test_vulkan_sdk.py tests/test_rhi_menu_sampling.py
            tests/test_frame_replay.py
            tests/test_debug_settings_model.py
            tests/test_network_guest_dispatch.py tests/test_network_bot_results.py tests/test_network_movement_stats.py tests/test_network_motion_stats.py tests/test_network_pose_stats.py tests/test_procedural_surface_stats.py
            tests/test_auto_look.py tests/test_terminal_mouse.py tests/test_mounted_mouse.py tests/test_keyboard_menu.py tests/test_weapon_slots.py tests/test_menu_mouse.py tests/test_menu_text.py tests/test_quit_menu.py tests/test_ui_layout.py tests/test_camera_feed.py tests/test_crane_overlay.py tests/test_ghost_actor_overlay.py
          )
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            tests+=(tests/test_frame_interpolation.py tests/test_prediction_targets.py tests/test_config_initialization.py tests/test_pc_refresh.py tests/test_window_theme.py tests/test_online_theme.py tests/test_online.py tests/test_online_host.py tests/test_network_identity.py)
          fi
          python -m pytest "${tests[@]}" -q --tb=short
      - name: Validate common RHI on the native Mac GPU without game assets
        if: needs.plan.outputs.gpu == 'true' && runner.os == 'macOS'
        run: |
          python - <<'PYCODE'
          from pathlib import Path
          import subprocess, sys
          pins = [line for line in Path('requirements.txt').read_text().splitlines()
                  if line.startswith(('cmake==', 'ninja=='))]
          subprocess.run([sys.executable, '-m', 'pip', 'install', *pins], check=True)
          PYCODE
          python tools/test-rhi-mac.py --setup-sdk --driver moltenvk
      - name: Test release validation and disposable fixture cleanup
        if: needs.plan.outputs.release == 'true'
        run: python -m pytest tests/test_publish_release.py tests/test_crash_symbols.py tests/test_native_mac_package.py tests/test_build_textures.py tests/test_texture_release.py -q --tb=short

  # Preserve the two existing branch-protection check names. An intentional
  # scope skip passes; failed/cancelled/missing or unexpectedly skipped work fails.
  patch-transitions:
    name: Patch transitions (${{ matrix.os }})
    needs: [plan, patches, native]
    if: always()
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Test subscription worker selection and publication boundaries
        run: python -m unittest discover -s tests -p test_compatibility_worker.py -v
      - name: Require all selected host checks
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          RUN_TRANSITIONS: ${{ needs.plan.outputs.transitions }}
          RUN_NATIVE: ${{ needs.plan.outputs.native }}
          RUN_RELEASE: ${{ needs.plan.outputs.release }}
          PATCHES_RESULT: ${{ needs.patches.result }}
          NATIVE_RESULT: ${{ needs.native.result }}
        run: python tools/ci-runtime-scope.py --gate
