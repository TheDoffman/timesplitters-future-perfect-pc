name: Launcher compatibility checks

# Report on every PR so the final check can be required, including unrelated PRs.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: launcher-compatibility-${{ github.event.number || github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.plan.outputs.run }}
      head: ${{ steps.plan.outputs.head }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Select both host checks for launcher changes
        id: plan
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = workflow_dispatch ] || [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = 0000000000000000000000000000000000000000 ]; then
            python tools/ci/launcher-compatibility.py scope --head "$HEAD_SHA" --all
          else
            python tools/ci/launcher-compatibility.py scope --base "$BASE_SHA" --head "$HEAD_SHA"
          fi

  build:
    needs: scope
    if: needs.scope.outputs.run == 'true'
    uses: ./.github/workflows/launcher-build.yml
    with:
      source_ref: ${{ needs.scope.outputs.head }}

  gate:
    name: Launcher compatibility
    needs: [scope, build]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Require complete Windows and Mac validation
        env:
          SCOPE_RESULT: ${{ needs.scope.result }}
          SHOULD_BUILD: ${{ needs.scope.outputs.run }}
          BUILD_RESULT: ${{ needs.build.result }}
        run: python3 tools/ci/launcher-compatibility.py gate --scope "$SCOPE_RESULT" --run "$SHOULD_BUILD" --build "$BUILD_RESULT"
