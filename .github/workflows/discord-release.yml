name: Discord game release announcements
on:
  workflow_dispatch:
    inputs:
      channel:
        description: One-time archival migration of four existing release posts
        type: choice
        options: [archive]
        default: archive
        required: true
permissions:
  contents: read
concurrency:
  group: discord-archive-four-releases
  cancel-in-progress: false
jobs:
  archive:
    if: github.repository == 'TheDoffman/timesplitters-future-perfect-pc'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Copy original release cards without notifications
        env:
          DISCORD_STABLE_RELEASE_WEBHOOK: ${{ secrets.DISCORD_STABLE_RELEASE_WEBHOOK }}
        shell: python
        run: |
          import json, os, re, urllib.request
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, *args, **kwargs):
                  return None
          opener = urllib.request.build_opener(NoRedirect)
          webhook = os.environ["DISCORD_STABLE_RELEASE_WEBHOOK"].strip()
          if not re.fullmatch(r"https://discord\.com/api/webhooks/[0-9]+/[A-Za-z0-9._-]+", webhook):
              raise SystemExit("Invalid webhook format")
          def request(url, payload=None):
              req = urllib.request.Request(url, data=None if payload is None else json.dumps(payload).encode(), headers={"Content-Type":"application/json", "User-Agent":"TSFP-Release-Archive"})
              try:
                  with opener.open(req, timeout=30) as response:
                      return json.load(response)
              except Exception:
                  raise SystemExit("Discord request failed; inspect channel before retrying") from None
          metadata = request(webhook)
          if metadata.get("channel_id") != "1566483143748231228":
              raise SystemExit("Webhook does not target release-updates")
          archives = json.loads("[{\"source_id\":\"1566344950335930479\",\"payload\":{\"username\":\"TimeSplitters Releases\",\"content\":\"Archived release post moved from #announcements. This copy does not publish a new release.\",\"allowed_mentions\":{\"parse\":[]},\"embeds\":[{\"title\":\"TimeSplitters: Future Perfect Recomp · v0.5.0-story-coop-beta.1\",\"url\":\"https://github.com/TheDoffman/timesplitters-future-perfect-pc/releases/tag/v0.5.0-story-coop-beta.1\",\"description\":\"Opt-in test build. In the launcher, select Preview and the Story Coop Beta Preview testing track. Review compatibility and known issues first. TimeSplitters: Future Perfect PC v0.5.0-story-coop-beta.1 for Windows 10/11 x64. This is an experimental PC port. Original US Xbox game files are required and are not included. Game channel: Story Co-op Beta Preview. Included Stable baseline: v0.4.0 Opt-in test build. Features and save/network compatibility may change. Review Known issues before testing.\\n\\n### Story Co-op Beta 1\\nThis Windows preview adds experimental Online Story co-op for up to four players, focused on the first mission, Time to Split. Open Story, choose Online, connect to the same directory service, and join the host's match. All players must run this exact version with matching game content. This build includes the recent main-branch updates and the multiplayer improvements tested during Story co-op development:\\n• More consistent guest NPC facing, smoother animation, retained corpses and replicated ragdolls.\\n• Smoother dropped-weapon movement and physics, with weapon drop and pickup synchronization fixes.\\n• Improved first-mission explosions, barricade debris, splitter camouflage and player synchronization.\\n• Lobby navigation, level thumbnails, rewards, game-over/rejoin handling and checkpoint/level-transition repairs.\\n• Sniper encounter staging now transports all players and stops guests at the marine before the cutscene.\\n\\n### Known limits\\nA guest can still briefly freeze again after the sniper cutscene. Movement returns after a few seconds; this issue is deferred. Story co-op remains experimental, and other missions have not been validated. Automatic checks do not establish complete mission playability; please report remaining gameplay and synchronization problems. The new Story Local/Online chooser is enabled only in game versions containing story-coop . Stable versions reta…\\n\\n[View release & downloads](https://github.com/TheDoffman/timesplitters-future-perfect-pc/releases/tag/v0.5.0-story-coop-beta.1)\",\"color\":15050051,\"timestamp\":\"2026-11-01T06:55:37.442Z\",\"footer\":{\"text\":\"Archived release announcement · Original post date shown below\"}}]}},{\"source_id\":\"1566356823337083002\",\"payload\":{\"username\":\"TimeSplitters Releases\",\"content\":\"Archived release post moved from #announcements. This copy does not publish a new release.\",\"allowed_mentions\":{\"parse\":[]},\"embeds\":[{\"title\":\"TimeSplitters: Future Perfect Recomp · v0.5.0-story-coop-beta.1\",\"url\":\"https://github.com/TheDoffman/timesplitters-future-perfect-pc/releases/tag/v0.5.0-story-coop-beta.1\",\"description\":\"Opt-in test build. In the launcher, select Preview and the Story Coop Beta Preview testing track. Review compatibility and known issues first. TimeSplitters: Future Perfect PC v0.5.0-story-coop-beta.1 for Windows 10/11 x64. This is an experimental PC port. Original US Xbox game files are required and are not included. Game channel: Story Co-op Beta Preview. Included Stable baseline: v0.4.0 Opt-in test build. Features and save/network compatibility may change. Review Known issues before testing.\\n\\n### Story Co-op Beta 1\\nRepacked 2026-11-01: The corrected game now reads its build version consistently, restoring Story Local/Online in this preview. The original beta.1 package hid the chooser despite showing the correct preview watermark. If you already installed beta.1, download and reinstall this corrected package while preserving Data, Settings, Saves and Textures; the unchanged version number will not appear as a newer automatic update. All peers must use the corrected build. This Windows preview adds experimental Online Story co-op for up to four players, focused on the first mission, Time to Split. Open Story, choose Online, connect to the same directory service, and join the host's match. All players must run this exact version with matching game content. This build includes the recent main-branch updates and the multiplayer improvements tested during Story co-op development:\\n• More consistent guest NPC facing, smoother animation, retained corpses and replicated ragdolls.\\n• Smoother dropped-weapon movement and physics, with weapon drop and pickup synchronization fixes.\\n• Improved first-mission explosions, barricade debris, splitter camouflage and player synchronization.\\n• Lobby navigation, level thumbnails, rewards, game-over/rejoin handling and checkpoint/level-transition repairs.\\n• Sniper encounter staging now transports all players and stops guests at the marine before the cutsc…\\n\\n[View release & downloads](https://github.com/TheDoffman/timesplitters-future-perfect-pc/releases/tag/v0.5.0-story-coop-beta.1)\",\"color\":15050051,\"timestamp\":\"2026-11-01T07:42:48.186Z\",\"footer\":{\"text\":\"Archived release announcement · Original post date shown below\"}}]}},{\"source_id\":\"1566364082766880842\",\"payload\":{\"username\":\"TimeSplitters Releases\",\"content\":\"Archived release post moved from #announcements. This copy does not publish a new release.\",\"allowed_mentions\":{\"parse\":[]},\"embeds\":[{\"title\":\"TimeSplitters: Future Perfect Recomp · v0.4.1\",\"url\":\"https://github.com/TheDoffman/timesplitters-future-perfect-pc/releases/tag/v0.4.1\",\"description\":\"In the launcher, keep Stable selected and choose Check updates . TimeSplitters: Future Perfect PC v0.4.1 for Windows 10/11 x64 and Apple Silicon Mac. This is an experimental PC port. Original US Xbox game files are required and are not included. Game channel: Stable. Included Stable baseline: v0.4.0 Stable game release. The port remains experimental; see known platform limitations.\\n\\n### Changes since v0.4.0\\n\\n• Restore mouse aiming in the Battle Mech (#431)\\n• Keep Assault objective markers aligned on widescreen (#424)\\n• Fix general audio dropouts independently of Enhanced Audio beta (#432)\\n• Clean up released sounds and improve audio dropout diagnostics (#433)\\n• Add game language selection to the launcher (#436)\\n• Multiplayer: improve guest NPCs, corpses and dropped weapons (#441)\\n• Preserve short weapon clicks at high frame rates (#442)\\n• Story: use the compiled game version for the co-op menu (#451)\\n• Restore native Mac Online build linkage (#452) Full Changelog : [https://github.com/TheDoffman/timesplitters-future-perfect-pc/compare/v0.4.0...v0.4.1](https://github.com/TheDoffman/timesplitters-future-perfect-pc/compare/v0.4.0...v0.4.1)\\n\\n### Platforms and compatibility\\nBoth platform packages include launcher 1.4.2. System Link and Online pl…\\n\\n[View release & downloads](https://github.com/TheDoffman/timesplitters-future-perfect-pc/releases/tag/v0.4.1)\",\"color\":5793266,\"timestamp\":\"2026-11-01T08:11:38.969Z\",\"footer\":{\"text\":\"Archived release announcement · Original post date shown below\"}}]}},{\"source_id\":\"1566368654784725103\",\"payload\":{\"username\":\"TimeSplitters Releases\",\"content\":\"Archived release post moved from #announcements. This copy does not publish a new release.\",\"allowed_mentions\":{\"parse\":[]},\"embeds\":[{\"title\":\"TimeSplitters: Future Perfect Recomp · v0.5.0-story-coop-beta.1\",\"url\":\"https://github.com/TheDoffman/timesplitters-future-perfect-pc/releases/tag/v0.5.0-story-coop-beta.1\",\"description\":\"Opt-in test build. In the launcher, select Preview and the Story Coop Beta Preview testing track. Review compatibility and known issues first. TimeSplitters: Future Perfect PC v0.5.0-story-coop-beta.1 for Windows 10/11 x64. This is an experimental PC port. Original US Xbox game files are required and are not included. Game channel: Story Co-op Beta Preview. Included Stable baseline: v0.4.0 This build does not include the latest Stable release, v0.4.1. Opt-in test build. Features and save/network compatibility may change. Review Known issues before testing.\\n\\n### Story Co-op Beta 1\\nRepacked again 2026-11-01: Restores the Story lobby heading and thumbnail, mission/difficulty selection, Back navigation and full main-menu return. The version flag now preserves the original Story co-op menu behavior. Local host/guest testing covered these menus and the first mission's intro, firearm handoff, synchronized movement and firing. If you already installed beta.1, download and reinstall this corrected package while preserving Data, Settings, Saves and Textures; the unchanged version number will not appear as a newer automatic update. All peers must use this corrected build. This Windows preview adds experimental Online Story co-op for up to four players, focused on the first mission, Time to Split. Open Story, choose Online, connect to the same directory service, and join the host's match. All players must run this exact version with matching game content. This build includes the recent main-branch updates and the multiplayer improvements tested during Story co-op development:\\n• More consistent guest NPC facing, smoother animation, retained corpses and replicated ragdolls.\\n• Smoother dropped-weapon movement and physics, with weapon drop and pickup synchronization fixes.\\n• Improved first-mission explosions, barricade debris, splitter camouflage and player synchronization.\\n• Lobby navigation, level…\\n\\n[View release & downloads](https://github.com/TheDoffman/timesplitters-future-perfect-pc/releases/tag/v0.5.0-story-coop-beta.1)\",\"color\":15050051,\"timestamp\":\"2026-11-01T08:29:49.023Z\",\"footer\":{\"text\":\"Archived release announcement · Original post date shown below\"}}]}}]")
          
          new_ids = ["1566487635378053202","1566487636053467317","1566487636766490655","1566487637865402503"]
          for item, new_id in zip(archives, new_ids, strict=True):
              copied = request(webhook + "/messages/" + new_id)
              expected = item["payload"]["embeds"][0]
              if copied.get("channel_id") != "1566483143748231228" or copied.get("mentions") or copied.get("mention_roles"):
                  raise SystemExit("Archived message channel or mentions mismatch")
              actual = copied["embeds"][0]
              for key in ("title", "url", "description"):
                  if actual.get(key) != expected[key]:
                      raise SystemExit("Archived embed mismatch")
          originals = []
          for item in archives:
              original = request(webhook + "/messages/" + item["source_id"])
              if original.get("channel_id") != "1566296049830858833" or original.get("webhook_id") != metadata["id"]:
                  raise SystemExit("Original message channel or webhook mismatch")
              if original.get("embeds", [{}])[0].get("title") != item["payload"]["embeds"][0]["title"]:
                  raise SystemExit("Original title mismatch")
              originals.append(item["source_id"])
          for source_id in originals:
              req = urllib.request.Request(webhook + "/messages/" + source_id, method="DELETE", headers={"User-Agent":"TSFP-Release-Archive"})
              try:
                  with opener.open(req, timeout=30) as response:
                      if response.status != 204:
                          raise SystemExit("Unexpected delete result")
              except Exception:
                  raise SystemExit("Delete result unavailable; inspect originals before retrying") from None
              print("Deleted original " + source_id, flush=True)
