name: Automatic issue labels

on:
  issues:
    types: [opened, edited, reopened]

permissions:
  contents: read

jobs:
  labels:
    if: github.event_name == 'issues'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    concurrency:
      group: issue-labels-${{ github.event.issue.number }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Label report type and selected platform
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python tools/ci/issue-forms.py labels

  known-issues:
    needs: labels
    permissions:
      contents: read
    secrets:
      KNOWN_ISSUES_TOKEN: ${{ secrets.KNOWN_ISSUES_TOKEN }}
    # GITHUB_TOKEN label writes do not emit another issues workflow event.
    uses: ./.github/workflows/known-issues.yml
