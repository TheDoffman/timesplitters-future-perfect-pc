name: Issue form versions

on:
  push:
    branches: [main]
    paths:
      - .github/ISSUE_TEMPLATE/**
      - .github/workflows/issue-form-versions.yml
      - tools/ci/issue-forms.py
      - tests/repository/test_issue_forms.py
      - VERSION
      - tools/launcher/LauncherVersion.cs
  release:
    types: [published, edited, deleted, unpublished]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate version references
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests/repository -p test_issue_forms.py -v

  versions:
    needs: validate
    if: github.event_name != 'pull_request' && github.event_name != 'issues' && (github.event_name == 'release' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: issue-form-versions
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Propose published version reference updates
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TARGET_BRANCH: ${{ github.event.repository.default_branch }}
        run: python tools/ci/issue-forms.py versions --pull-request --base-branch "$TARGET_BRANCH"
