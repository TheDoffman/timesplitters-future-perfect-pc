name: Repository texture pack

on:
  pull_request:
    paths:
      - 'assets/textures/**'
      - '.gitattributes'
      - 'config/textures/texture-pack.json'
      - 'tools/textures/build_textures.py'
      - 'tools/textures/texture-repository.py'
      - 'tools/textures/texture-release.py'
      - 'tests/textures/test_build_textures.py'
      - '.github/workflows/texture-pack.yml'
  push:
    branches: [main]
    paths:
      - 'assets/textures/**'
      - 'config/textures/texture-pack.json'
      - 'tools/textures/build_textures.py'
      - 'tools/textures/texture-repository.py'
      - 'tools/textures/texture-release.py'
      - '.gitattributes'
      - '.github/workflows/texture-pack.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          lfs: true
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Verify repository LFS textures and metadata
        run: |
          python - <<'PY'
          import json, sys
          from pathlib import Path
          sys.path.insert(0, 'tools')
          from project_paths import configure
          configure()
          from build_textures import ensure_pack
          pack, records, identity = ensure_pack()
          manifest = json.loads(Path('config/textures/texture-pack.json').read_text())
          assert manifest['schema'] == 2 and manifest['delivery'] == 'optional'
          assert manifest['texture_count'] == identity['texture_count']
          assert manifest['installed_bytes'] == identity['installed_bytes']
          for path, public, sha in records:
              assert path.with_suffix('.json').read_bytes() == public, path.name
          print(identity)
          PY
