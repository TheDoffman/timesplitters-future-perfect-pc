name: Launcher release (Windows + Mac)

on:
  push:
    tags: ['launcher-v*']
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the version in LauncherVersion.cs (default branch only)
        type: boolean
        default: false

permissions:
  contents: read

# Never cancel a publication halfway through uploading its draft.
concurrency:
  group: launcher-release-${{ github.event_name == 'pull_request' && github.ref || 'publication' }}
  cancel-in-progress: false

jobs:
  build:
    name: Validate both launchers
    uses: ./.github/workflows/launcher-build.yml
    permissions:
      contents: read

  publish:
    name: Publish both platform updates together
    needs: build
    if: >-
      needs.build.outputs.publish == 'true' &&
      github.repository == 'TheDoffman/timesplitters-future-perfect-pc' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Changelog filtering needs the previous launcher tag and commit range.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: launcher-build-inputs
          path: build
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: launcher-*
          path: build/launcher-release
          merge-multiple: true
      - name: Upload verified assets to draft, then publish and refresh issue-form versions
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python tools/launcher-release.py publish
