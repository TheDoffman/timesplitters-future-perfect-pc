name: Issue resolution notes

on:
  pull_request_target:
    types: [closed]
    branches: [main]

permissions:
  contents: read

jobs:
  comment:
    if: github.event_name == 'pull_request_target' && github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      issues: write
    concurrency:
      group: issue-resolution-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    steps:
      # Only run repository-owned default-branch code with the write token.
      # Never check out a contributor's head ref or evaluate the PR body as code.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Post the merged explanation on linked issues
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python tools/ci/issue-resolution.py
