name: Launcher build and package checks

on:
  workflow_call:
    inputs:
      source_ref:
        description: Exact PR head for validation; empty for the release event source
        type: string
        default: ''
    outputs:
      publish:
        value: ${{ jobs.windows.outputs.publish }}
      version:
        value: ${{ jobs.windows.outputs.version }}

permissions:
  contents: read

jobs:
  windows:
    name: Build and test Windows launcher
    runs-on: windows-latest
    timeout-minutes: 20
    outputs:
      publish: ${{ steps.plan.outputs.publish }}
      version: ${{ steps.plan.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.source_ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Validate release version and source
        id: plan
        env:
          LAUNCHER_VALIDATION_SHA: ${{ inputs.source_ref }}
        run: python tools/release/launcher-release.py plan
      - name: Test publication and recovery policy
        run: python -m unittest discover -s tests/launcher -p test_launcher_release.py -v
      - name: Test compatibility automation policy
        run: python -m unittest discover -s tests/launcher -p test_launcher_compatibility.py -v
      - name: Test shared launcher layout and theme propagation
        run: python -m unittest discover -s tests/launcher -p test_launcher_shared_ui.py -v
      - name: Install pinned packaging and icon test dependencies
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess, sys
          pins = [line for line in Path('requirements.txt').read_text().splitlines()
                  if line.startswith(('pytest==', 'Pillow==', 'pefile==', 'ninja==', 'cmake=='))]
          subprocess.run([sys.executable, '-m', 'pip', 'install', *pins], check=True)
          PY
      - name: Test startup preferences, packaging and Windows game icons
        run: python -m pytest tests/launcher/test_launcher_startup.py tests/launcher/package_launcher.py tests/repository/test_game_icon.py -q --tb=short
      - name: Recover checksum-pinned original artwork
        shell: powershell
        run: ./tools/build/fetch-launcher-art.ps1
      - name: Build release package and run Windows launcher regressions
        shell: powershell
        run: |
          ./tools/build/build-launcher.ps1 -Test -RequireArtwork -BannerPath build/launcher-art/launcher-banner.png -LogoPath build/launcher-art/launcher-logo.png -BackdropPath build/launcher-art/launcher-backdrop.png
          Copy-Item build/launcher/launcher.ico build/launcher-art/launcher.ico
      - name: Verify Windows update package and record its source
        run: python tools/release/launcher-release.py stamp --directory build/launcher --platform windows-x64
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: launcher-windows
          path: |
            build/launcher/TimeSplitters-Launcher-v${{ steps.plan.outputs.version }}-windows-x64.zip
            build/launcher/TimeSplitters-Launcher-v${{ steps.plan.outputs.version }}-windows-x64.zip.sha256
            build/launcher/launcher-update.json
            build/launcher/launcher-build-windows-x64.json
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: launcher-build-inputs
          path: |
            build/launcher-release-plan.json
            build/launcher-art/*.png
            build/launcher-art/launcher.ico
          if-no-files-found: error
          retention-days: 7

  mac:
    name: Build and test native Mac launcher
    needs: windows
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: launcher-build-inputs
          path: build
      - name: Test publication and recovery policy on Mac
        run: python -m unittest discover -s tests/launcher -p test_launcher_release.py -v
      - name: Test compatibility automation policy
        run: python -m unittest discover -s tests/launcher -p test_launcher_compatibility.py -v
      - name: Test shared launcher layout and theme propagation
        run: python -m unittest discover -s tests/launcher -p test_launcher_shared_ui.py -v
      - name: Build release package and run native launcher regressions
        run: |
          test "$(uname -m)" = arm64
          python tools/build/build-mac-launcher.py --install-sdk --test --require-artwork --artwork-dir build/launcher-art --package
      - name: Test packaged Mac update, repair and restart
        env:
          LAUNCHER_VERSION: ${{ needs.windows.outputs.version }}
        run: >-
          "build/macos-launcher/TimeSplitters Launcher.app/Contents/MacOS/TimeSplitters.Launcher"
          --verify-package "build/macos-launcher/TimeSplitters-Launcher-v${LAUNCHER_VERSION}-macos-arm64.zip" "$LAUNCHER_VERSION"
      - name: Verify Mac update package and record its source
        run: python tools/release/launcher-release.py stamp --directory build/macos-launcher --platform macos-arm64
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: launcher-macos
          path: |
            build/macos-launcher/TimeSplitters-Launcher-v${{ needs.windows.outputs.version }}-macos-arm64.zip
            build/macos-launcher/TimeSplitters-Launcher-v${{ needs.windows.outputs.version }}-macos-arm64.zip.sha256
            build/macos-launcher/launcher-update-macos-arm64.json
            build/macos-launcher/launcher-build-macos-arm64.json
          if-no-files-found: error
          retention-days: 7

  verify:
    name: Verify complete dual-platform release
    needs: [windows, mac]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: launcher-build-inputs
          path: build
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: launcher-*
          path: build/launcher-release
          merge-multiple: true
      - run: python tools/release/launcher-release.py verify
