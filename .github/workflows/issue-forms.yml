name: Issue form tests

on:
  pull_request:
    paths:
      - .github/ISSUE_TEMPLATE/**
      - .github/workflows/issue-forms.yml
      - .github/workflows/issue-labels.yml
      - .github/workflows/issue-form-versions.yml
      - .github/workflows/known-issues.yml
      - .github/known-issues.json
      - tools/ci/issue-forms.py
      - tools/ci/known-issues.py
      - tests/repository/test_issue_forms.py
      - tests/repository/test_known_issues.py
      - VERSION
      - tools/launcher/LauncherVersion.cs
  push:
    branches: [main]
    paths:
      - .github/ISSUE_TEMPLATE/**
      - .github/workflows/issue-forms.yml
      - .github/workflows/issue-labels.yml
      - .github/workflows/issue-form-versions.yml
      - .github/workflows/known-issues.yml
      - .github/known-issues.json
      - tools/ci/issue-forms.py
      - tools/ci/known-issues.py
      - tests/repository/test_issue_forms.py
      - tests/repository/test_known_issues.py
      - VERSION
      - tools/launcher/LauncherVersion.cs

permissions:
  contents: read

jobs:
  validate:
    name: Issue form tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests/repository -p test_issue_forms.py -v
      - run: python -m unittest discover -s tests/repository -p test_known_issues.py -v
