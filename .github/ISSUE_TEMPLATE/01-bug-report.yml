name: Report a problem
description: Tell us about something that is not working.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Tell us what went wrong. Check [existing reports](https://github.com/TheDoffman/timesplitters-future-perfect-pc/issues) first.
        Enter the versions you have installed. If you cannot find one, type **I don't know** rather than guessing.
  - type: markdown
    attributes:
      value: |
        <details>
        <summary>Published versions (reference only)</summary>

        **Game releases**

        <!-- BEGIN AUTO GAME VERSIONS -->
        - `v0.4.0`
        - `v0.4.0-story-coop.1`
        - `v0.3.6`
        - `v0.3.5`
        - `v0.3.4`
        - `v0.3.3`
        - `v0.3.2`
        - `v0.3.1-alpha.2`
        - `v0.3.1-alpha.1`
        - `v0.3.0-alpha.2`
        - `v0.3.0-alpha.1`
        - `v0.2.0-alpha.6`
        - `v0.2.0-alpha.5`
        - `v0.2.0-alpha.4`
        - `v0.2.0-alpha.3`
        - `v0.2.0-alpha.2`
        - `v0.1.0-alpha.1`
        <!-- END AUTO GAME VERSIONS -->

        **Launcher releases**

        <!-- BEGIN AUTO LAUNCHER VERSIONS -->
        - `v1.4.1`
        - `v1.4.0`
        - `v1.3.1`
        - `v1.3.0`
        - `v1.2.24`
        - `v1.2.23`
        - `v1.2.22`
        - `v1.2.20`
        - `v1.2.18`
        - `v1.2.17`
        - `v1.2.16`
        - `v1.2.15`
        - `v1.2.14`
        - `v1.2.13`
        - `v1.2.12`
        - `v1.2.11`
        - `v1.2.10`
        - `v1.2.9`
        - `v1.2.8`
        - `v1.2.7`
        - `v1.2.6`
        - `v1.2.5`
        - `v1.2.4`
        - `v1.2.3`
        - `v1.2.2`
        - `v1.2.1`
        - `v1.2.0`
        - `v1.1.2`
        - `v1.1.1`
        - `v1.1.0`
        <!-- END AUTO LAUNCHER VERSIONS -->

        </details>
  - type: input
    id: game-version
    attributes:
      label: Game version
      description: Copy the installed game version from the launcher. If none is installed, enter Not installed yet.
      placeholder: Enter your installed game version, or I don't know
    validations:
      required: true
  - type: input
    id: launcher-version
    attributes:
      label: Launcher version
      description: Copy LAUNCHER v... from the top of the launcher window. If you do not use it, enter Not using the launcher.
      placeholder: Enter your launcher version, or I don't know
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Platform
      description: Enter your operating system, such as Windows 11, Windows 10, or macOS.
      placeholder: Enter your operating system
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: What went wrong, and what did you expect instead? Include any error message you saw.
      placeholder: "Example: The game closes when I select Story mode. I expected the level to load."
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How can we make it happen?
      description: List what you clicked or did. Include the level or game mode, if relevant. If you are not sure, tell us what you were doing.
      placeholder: |
        1. Open the game.
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Anything else? (optional)
      description: Attach a screenshot, video, or log if you have one. View logs in the launcher opens its log folder. You can also mention your graphics card, settings, or how often it happens. Remove personal information and do not upload game files or saves.
  - type: textarea
    id: diagnostics
    attributes:
      label: Launcher diagnostics (optional)
      description: Open Diagnostics in the launcher and choose Report a bug. If the launcher copied a longer report, paste the complete report here. Review before submitting; do not include private paths, raw logs, game files or saves.
      placeholder: Paste the filtered diagnostic report from the launcher here.
      render: text
