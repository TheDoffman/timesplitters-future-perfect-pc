# Build and test on every push.
#
# No game files are needed or used: the Python suite runs against synthetic
# instructions and synthetic XBEs, the C build produces the runtime libraries,
# and ctest runs small offline tests over them. Nothing here links a
# recompiled title.
#
# Why it exists: the v0.9.0 upstream merge broke the MSVC build twice (a
# dropped closing brace, and two bodies for one bridge function) and nothing
# noticed, because no job compiled the C. The Linux job is the only thing
# that proves the kernel library stays free of Windows and Direct3D headers.

name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: python -m pip install pytest capstone

      # tools/fusion needs pefile and MS Fusion inputs; it is optional tooling.
      - name: Run tests
        run: python -m pytest -q --ignore=tools/fusion

  linux:
    name: Build and test (Linux, GCC)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # SDL3 is built from its submodule; the others are not needed here.
      - name: Fetch SDL3
        run: git submodule update --init --depth 1 third_party/SDL

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build pkg-config libepoxy-dev libssl-dev

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

  windows:
    name: Build and test (Windows, MSVC)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Fetch SDL3
        run: git submodule update --init --depth 1 third_party/SDL

      - name: Configure
        run: cmake -S . -B build -A x64

      - name: Build
        run: cmake --build build --config Debug --parallel

      - name: Test
        run: ctest --test-dir build -C Debug --output-on-failure
